*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;background:var(--fondo);color:#1d1d1b;line-height:1.5}
a{color:var(--v)}

.barra button{background:rgba(255,255,255,.16);color:#fff;cursor:pointer}.barra button.on{background:#fff;color:var(--v)}
.zona{flex:1;display:flex;flex-direction:column;align-items:center;padding:1.4rem 1rem 2rem}

.etq{color:var(--mo);font-weight:700;font-size:.85rem;letter-spacing:.05em;text-transform:uppercase}
.preg{font-size:clamp(1.25rem,2.6vw,1.9rem);line-height:1.35;margin:.4rem 0 1.2rem}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media (max-width:640px){.ops{grid-template-columns:1fr}}
.op{display:flex;gap:.8rem;align-items:center;text-align:left;font:inherit;font-size:clamp(1rem,2vw,1.35rem);background:#fff;border:2px solid var(--linea);border-radius:12px;padding:.85rem 1rem;cursor:pointer;transition:transform .08s,border-color .15s,background .15s}
.op:hover{border-color:var(--mo);transform:translateY(-1px)}
.op .l{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--mo);color:#fff;display:grid;place-items:center;font-family:system-ui,sans-serif;font-weight:700;font-size:.95rem}
.op.ok{background:var(--vc);border-color:var(--v)}.op.ok .l{background:var(--v)}
.op.no{background:#fdecea;border-color:#c0392b}.op.no .l{background:#c0392b}
.op.apagada{opacity:.45}
.ops.fin .op{cursor:default;transform:none}
.reloj{height:6px;background:var(--linea);border-radius:3px;margin:-.4rem 0 1rem;overflow:hidden;display:none}.reloj b{display:block;height:100%;background:var(--am);width:100%}
.expl{display:none;margin-top:1.1rem;background:#eef6f7;border-left:4px solid #00787f;border-radius:8px;padding:.8rem 1rem;font-size:1.08rem}

.btn.sec{background:#fff;color:var(--v);border:2px solid var(--v)}
.ayuda{font-size:.8rem;color:var(--gr)}
.final h2{font-size:2rem;margin:.2rem 0}.final .grande{font-size:4rem;font-weight:800;color:var(--v);font-family:system-ui,sans-serif}
.final ol{text-align:left}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden}.conf i{position:absolute;width:10px;height:14px;top:-20px;animation:cae 2.4s linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(720deg)}}

(function(){

 function q(){return S.q[k];}
 function turno(){return k%2===0?'A':'B';}
 function pintaMarc(){
   pts.innerHTML=S.q.map(function(_,i){return '<i class="'+(res[i]===true?'ok':res[i]===false?'no':i===k?'act':'')+'"></i>';}).join('');
   var a=res.filter(function(x){return x===true;}).length;

   document.getElementById('eqA').classList.toggle('turno',equipos&&turno()==='A'&&k<S.q.length);
   document.getElementById('eqB').classList.toggle('turno',equipos&&turno()==='B'&&k<S.q.length);
 }
 function cargar(n){S=DATOS.filter(function(s){return s.n==n;})[0]||DATOS[0];sel.value=S.n;k=0;res=[];marc={A:0,B:0};
   history.replaceState(null,'','?s='+S.n);mostrar();}
 function mostrar(){
   clearInterval(tm);
   if(k>=S.q.length){return final();}
   var P=q(), L='ABCD';
   tar.innerHTML='<div class="etq sans">Semana '+S.n+' · Pregunta '+(k+1)+' de '+S.q.length+(equipos?' · turno del equipo '+turno():'')+'</div>'+

     '<div class="expl" id="expl"></div>'+

 function responder(i){

 function confeti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;var c=document.createElement('div');c.className='conf';
